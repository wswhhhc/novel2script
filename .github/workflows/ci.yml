name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check code formatting
        run: |
          cd backend
          pip install black flake8
          black --check app tests --line-length 120
          flake8 app tests --count --statistics --max-line-length=120 --extend-ignore=E203

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Downgrade npm to v9 (npm 10 crashes on GHA runner)
        run: npm install -g npm@9

      - name: Set up Python for E2E backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Frontend: install & build"
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          node node_modules/typescript/bin/tsc --noEmit
          node node_modules/vite/bin/vite.js build

      - name: Run tests
        run: |
          cd frontend
          node node_modules/vitest/vitest.mjs run

      - name: Run E2E tests
        run: |
          cd frontend
          node node_modules/@playwright/test/cli.js test

      - name: Check code formatting
        run: |
          cd frontend
          npx prettier --check "src/**/*.{ts,tsx}" "e2e/**/*.ts" "playwright.config.ts" "vitest.config.ts"
