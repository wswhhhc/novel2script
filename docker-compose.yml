services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      ENABLE_AI_GENERATION: ${ENABLE_AI_GENERATION:-false}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.7}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4000}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-120}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      AUTO_FIX_ATTEMPTS: ${AUTO_FIX_ATTEMPTS:-3}
      NOVEL2SCRIPT_DB_PATH: /app/backend/data/novel2script.db
    ports:
      - "8000:8000"
    volumes:
      - novel2script-data:/app/backend/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  novel2script-data:
